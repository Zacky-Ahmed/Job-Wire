services:
  jobwire:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobwire
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "3000:3000"
    stop_grace_period: 2m10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
