<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Job Wire mark: the signal arcs rising to a point, on the coral tile
       the wordmark already uses. Drawn at 64 so it stays legible when a
       browser scales it down to a 16px tab. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset=".55" stop-color="#ff4d29"/>
      <stop offset="1" stop-color="#f0330a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round">
    <path d="M32 51V29"/>
    <path d="M13.5 30a25 25 0 0 1 37 0" opacity=".55"/>
    <path d="M21 39.5a15 15 0 0 1 22 0" opacity=".8"/>
  </g>
  <circle cx="32" cy="19.5" r="4.6" fill="#fff"/>
</svg>
