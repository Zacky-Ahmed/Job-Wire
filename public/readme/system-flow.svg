<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">How Job Wire works</title>
  <desc id="desc">Four job sources feed a single Job Wire process. It stores jobs in MongoDB, detects new matching roles, and sends one email alert.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7655"/></marker></defs>
  <rect width="1200" height="680" rx="24" fill="#0d1422"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="66" fill="#f8fafc" font-size="28" font-weight="700">One process, one clear path to an alert</text>
    <text x="64" y="100" fill="#9ba9c3" font-size="18">Sources are normalised, deduplicated, matched and delivered in the same always-on service.</text>
    <g fill="#161f32" stroke="#34415b" stroke-width="2">
      <rect x="64" y="170" width="190" height="70" rx="14"/><rect x="64" y="260" width="190" height="70" rx="14"/><rect x="64" y="350" width="190" height="70" rx="14"/><rect x="64" y="440" width="190" height="70" rx="14"/>
      <rect x="396" y="205" width="320" height="260" rx="20" fill="#17233a" stroke="#ff7655"/>
      <rect x="820" y="215" width="260" height="110" rx="18"/><rect x="820" y="380" width="260" height="110" rx="18"/>
    </g>
    <g fill="#f8fafc" font-size="21" font-weight="700"><text x="94" y="214">LinkedIn</text><text x="94" y="304">topjobs.lk</text><text x="94" y="394">John Keells</text><text x="94" y="484">MAS Holdings</text></g>
    <g fill="#9ba9c3" font-size="16"><text x="94" y="235">global listings</text><text x="94" y="325">Sri Lanka</text><text x="94" y="415">Sri Lanka</text><text x="94" y="505">Sri Lanka</text></g>
    <path d="M254 205H350V335H396M254 295H350M254 385H350M254 475H350" fill="none" stroke="#697790" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="556" y="255" text-anchor="middle" fill="#ffb29f" font-size="16" font-weight="700">JOB WIRE</text>
    <text x="556" y="305" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">Fetch and normalise</text>
    <text x="556" y="344" text-anchor="middle" fill="#d8e0ef" font-size="18">Find new jobs, match the watch</text>
    <text x="556" y="376" text-anchor="middle" fill="#d8e0ef" font-size="18">Refine where needed, check freshness</text>
    <text x="556" y="424" text-anchor="middle" fill="#9ba9c3" font-size="16">One scheduled sweep at a time</text>
    <path d="M716 290H820M716 405H820" fill="none" stroke="#ff7655" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="850" y="260" fill="#f8fafc" font-size="22" font-weight="700">MongoDB</text><text x="850" y="294" fill="#9ba9c3" font-size="17">queries · seen jobs</text><text x="850" y="317" fill="#9ba9c3" font-size="17">subscriptions · email log</text>
    <text x="850" y="426" fill="#f8fafc" font-size="22" font-weight="700">One alert email</text><text x="850" y="460" fill="#9ba9c3" font-size="17">New matching jobs only</text>
    <path d="M950 325V380" fill="none" stroke="#697790" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1080" y="620" text-anchor="end" fill="#9ba9c3" font-size="16">A new watch is primed first, so old postings do not flood the inbox.</text>
  </g>
</svg>
