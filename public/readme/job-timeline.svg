<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Why early job alerts matter</title>
  <desc id="desc">A four-step timeline: job posted at 09:14, Job Wire alerts at 09:16, twelve applications at 09:45, and ninety-four applications by 10:14.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#ff7655"/><stop offset="1" stop-color="#8d7df5"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#0d1422"/>
  <text x="64" y="64" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">The window is short</text>
  <text x="64" y="98" fill="#9ba9c3" font-family="Arial, sans-serif" font-size="18">Job Wire is built for the time between a posting appearing and the pile becoming too deep.</text>
  <path d="M126 190H1074" stroke="#26334b" stroke-width="4" stroke-linecap="round"/>
  <path d="M126 190H390" stroke="url(#line)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(126 190)"><circle r="15" fill="#ff7655"/><circle r="6" fill="#fff"/><text x="-4" y="-34" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">09:14</text><text x="0" y="48" text-anchor="middle" fill="#d8e0ef" font-size="18">A role is posted</text></g>
    <g transform="translate(390 190)"><circle r="18" fill="#ff7655" filter="url(#glow)"/><circle r="7" fill="#fff"/><text x="0" y="-34" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">09:16</text><text x="0" y="48" text-anchor="middle" fill="#d8e0ef" font-size="18">Job Wire alerts you</text><text x="0" y="74" text-anchor="middle" fill="#ffb29f" font-size="15">You can apply early</text></g>
    <g transform="translate(760 190)"><circle r="15" fill="#697790"/><circle r="6" fill="#fff"/><text x="0" y="-34" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">09:45</text><text x="0" y="48" text-anchor="middle" fill="#d8e0ef" font-size="18">12 applications</text></g>
    <g transform="translate(1074 190)"><circle r="15" fill="#697790"/><circle r="6" fill="#fff"/><text x="0" y="-34" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">10:14</text><text x="0" y="48" text-anchor="middle" fill="#d8e0ef" font-size="18">94 applications</text></g>
  </g>
</svg>
